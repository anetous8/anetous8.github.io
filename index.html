<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anetous8</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            font-family: 'Poppins', sans-serif;
            color: white;

            background:
                radial-gradient(circle at 50% 15%, #ff4fa3 0%, transparent 25%),
                linear-gradient(135deg, #120916, #09090f 60%, #160b18);

            overflow-x: hidden;
        }

        /* Instagram */
        .instagram {
            position: fixed;
            top: 25px;
            right: 30px;

            width: 52px;
            height: 52px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 15px;

            color: white;
            text-decoration: none;

            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(12px);

            transition: 0.3s ease;
        }

        .instagram:hover {
            transform: translateY(-3px) scale(1.08);

            background: linear-gradient(
                135deg,
                #833ab4,
                #fd1d1d,
                #fcb045
            );

            box-shadow: 0 0 25px rgba(253, 29, 29, 0.45);
        }

        .instagram svg {
            width: 32px;
            height: 32px;
        }

        /* Profil */
        .profile {
            width: 100%;
            max-width: 600px;

            margin-top: 55px;
            padding: 0 20px 50px;

            text-align: center;

            animation: fadeIn 1s ease;
        }

        /* PFP */
        .pfp-wrapper {
            width: 155px;
            height: 155px;

            padding: 5px;
            margin: 0 auto;

            border-radius: 50%;

            background: linear-gradient(
                135deg,
                #ff4fa3,
                #ff8ac5,
                #9b5cff
            );

            box-shadow:
                0 0 25px rgba(255, 79, 163, 0.55),
                0 0 70px rgba(255, 79, 163, 0.2);

            transition: 0.3s ease;
        }

        .pfp-wrapper:hover {
            transform: scale(1.06);

            box-shadow:
                0 0 35px rgba(255, 79, 163, 0.8),
                0 0 90px rgba(255, 79, 163, 0.3);
        }

        .pfp-wrapper img {
            width: 100%;
            height: 100%;

            object-fit: cover;
            border-radius: 50%;

            border: 3px solid #120916;

            display: block;
        }

        /* Jméno */
        h1 {
            margin: 20px 0 5px;

            font-size: 32px;
            font-weight: 700;

            background: linear-gradient(
                90deg,
                #fff,
                #ff9dcc,
                #fff
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .username {
            margin: 0;

            color: #b8aeb9;

            font-size: 15px;
        }

        /* Čára */
        .line {
            width: 60px;
            height: 3px;

            margin: 22px auto;

            border-radius: 10px;

            background: linear-gradient(
                90deg,
                #ff4fa3,
                #9b5cff
            );
        }

        /* Spotify */
        .songs {
            width: 100%;
            max-width: 500px;

            margin: 30px auto 0;

            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 14px;
        }

        .song {
            display: flex;
            align-items: center;

            gap: 13px;

            padding: 12px;

            text-decoration: none;
            color: white;

            background: rgba(255, 255, 255, 0.055);

            border: 1px solid rgba(255, 255, 255, 0.09);

            border-radius: 16px;

            backdrop-filter: blur(12px);

            transition: 0.3s ease;
        }

        .song:hover {
            transform: translateY(-4px);

            background: rgba(255, 255, 255, 0.1);

            box-shadow:
                0 10px 30px rgba(255, 79, 163, 0.2);
        }

        /* Cover obrázek */
        .song-cover {
            width: 58px;
            height: 58px;

            object-fit: cover;

            border-radius: 11px;

            flex-shrink: 0;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.4);
        }

        .song h3 {
            margin: 0;

            font-size: 15px;
            font-weight: 600;
        }

        .song p {
            margin: 3px 0 0;

            color: #aaa;

            font-size: 12px;
        }

        /* Třetí song uprostřed */
        .song-center {
            grid-column: 1 / 3;

            width: calc(50% - 7px);

            justify-self: center;
        }

        /* Animace */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobil */
        @media (max-width: 600px) {

            .instagram {
                top: 18px;
                right: 18px;

                width: 48px;
                height: 48px;
            }

            .instagram svg {
                width: 29px;
                height: 29px;
            }

            .profile {
                margin-top: 45px;
            }

            .pfp-wrapper {
                width: 135px;
                height: 135px;
            }

            h1 {
                font-size: 28px;
            }

            .songs {
                grid-template-columns: 1fr;
            }

            .song-center {
                grid-column: auto;

                width: 100%;
            }
        }
    </style>
</head>

                >

                >

    </div>
